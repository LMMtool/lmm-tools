<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada · LMM Ingeniería</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<style>
  :root{--primario:#1E3A5F;--acento:#2D6A9F;--claro:#4A90C4;--texto-dim:#6B7280}
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:Verdana,Geneva,Tahoma,sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    text-align:center;padding:24px;color:#1A1A2E;
    background:linear-gradient(135deg,#0f1d2e 0%,#1E3A5F 100%);
  }
  .box{max-width:480px}
  .code{
    font-family:'IBM Plex Mono',monospace;font-size:72px;font-weight:700;
    color:var(--claro);letter-spacing:-2px;line-height:1;margin-bottom:8px;
  }
  h1{color:#fff;font-size:22px;margin-bottom:12px}
  p{color:rgba(255,255,255,0.72);font-size:14px;line-height:1.6;margin-bottom:26px}
  .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  a.btn{
    display:inline-block;padding:12px 22px;border-radius:7px;text-decoration:none;
    font-size:13px;font-weight:bold;transition:all .25s;
  }
  .primary{background:var(--claro);color:var(--primario)}
  .primary:hover{background:#fff}
  .ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,0.25)}
  .ghost:hover{border-color:#fff;background:rgba(255,255,255,0.06)}
  .brand{
    margin-top:30px;font-family:'IBM Plex Mono',monospace;font-size:11px;
    letter-spacing:1px;color:rgba(255,255,255,0.5);text-transform:uppercase;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>Esta página no existe</h1>
    <p>El enlace puede estar roto o la herramienta se movió. Vuelve al inicio o abre la calculadora sísmica REP-21.</p>
    <div class="actions">
      <a class="btn primary" href="/">Ir al inicio →</a>
      <a class="btn ghost" href="/sismo/">Abrir REP-21</a>
    </div>
    <div class="brand">LMM Ingeniería · Ing. Luis Márquez</div>
  </div>
</body>
</html>
